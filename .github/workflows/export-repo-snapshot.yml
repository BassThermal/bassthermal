name: Export repository snapshot

on:
  push:
    branches:
      - agent/export-main-snapshot

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package checkout
        run: |
          rm -rf .git
          tar -czf "$RUNNER_TEMP/bassthermal-main-snapshot.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: bassthermal-main-snapshot
          path: ${{ runner.temp }}/bassthermal-main-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
