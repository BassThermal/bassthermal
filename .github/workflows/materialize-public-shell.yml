name: Materialize public brand shell

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: materialize-public-brand-shell-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-and-commit:
    if: github.head_ref == 'agent/static-public-brand-shell' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:deploy
      - name: Verify generated public shell
        run: npm run site-shell:validate
      - name: Commit generated public pages
        run: |
          if git diff --quiet -- public; then
            echo "Public outputs are already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "Materialize permanent public brand shell"
          git push origin HEAD:${{ github.head_ref }}
